name: Store package (MSIX)

# Builds the Microsoft Store MSIX/APPX, uploads it as a workflow artifact, and
# then publishes it to the Store (product 9MZ89Q1DGR0R) together with the
# listing text in store/listing.en-us.json, via the shared
# guscatalano/store-publish reusable workflow. Runs on every version tag, and
# on demand via "Run workflow" (a manual re-run of an already-submitted
# version is rejected by the Store — expected). The package is intentionally
# UNSIGNED — the Store signs it on ingestion — so no signing secrets are
# needed. Kept separate from the GitHub-release pipeline (build.yml), which
# produces the auto-updating direct-download installer.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build MSIX (electron-builder --win appx)
        run: npm run pack:store

      # electron-builder names it .appx, but `msstore publish` picks its publisher
      # by extension and has none for .appx ("We could not find a project
      # publisher" — the v0.12.0 Store run). Same OPC package format either way;
      # .msix is the extension the CLI (and the shared workflow) expects.
      - name: Rename .appx to .msix
        shell: pwsh
        run: Get-ChildItem release/*.appx | Rename-Item -NewName { $_.BaseName + '.msix' }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: pixelpet-msix
          path: release/*.msix
          if-no-files-found: error

  publish:
    needs: msix
    uses: guscatalano/store-publish/.github/workflows/publish.yml@main
    with:
      product-id: 9MZ89Q1DGR0R
      package-artifact: pixelpet-msix
      # Newest tag wins: a release stuck in the Store's one submission slot
      # (v0.12.0 sat there through a Store service outage) is replaced by the
      # next tag instead of blocking it. For PixelPet the newest build is
      # always the one we want out.
      supersede-pending: true
    secrets: inherit
