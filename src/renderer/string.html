<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>PixelPet String</title>
    <style>
      /* The string toy. All the motion lives in the canvas: the string is a
         simulated rope (see string/main.ts), not a rotating line — a rigid line
         swinging from a pivot reads as a windshield wiper, and everyone knows
         what string looks like. Click-through scenery; main owns the window. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module" src="./string/main.ts"></script>
  </body>
</html>
