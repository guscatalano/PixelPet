<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>PixelPet Sonar</title>
    <style>
      /* The tray's "Find Cat" ping: expanding rings centered on the pet. Pure CSS
         and no preload — main creates this window, shows it, and destroys it once
         the animation is done, so there's nothing to drive from script. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      .wrap { position: absolute; inset: 0; display: grid; place-items: center; }

      /* A soft pool of light under the pet, so your eye lands in the right place
         even before the rings have travelled. */
      .glow {
        position: absolute; width: 48%; height: 48%; border-radius: 50%;
        background: radial-gradient(circle, rgba(243, 199, 62, 0.42) 0%, rgba(243, 199, 62, 0) 68%);
        opacity: 0;
        animation: breathe 2.6s ease-out forwards;
      }
      @keyframes breathe {
        0%   { opacity: 0; }
        14%  { opacity: 1; }
        70%  { opacity: 0.5; }
        100% { opacity: 0; }
      }

      /* Three staggered rings in the app's accent yellow. The border thins as the
         ring grows so the stroke doesn't visually fatten under transform:scale. */
      .ring {
        position: absolute; width: 18%; height: 18%; border-radius: 50%;
        border: 5px solid #f3c73e;
        box-shadow: 0 0 12px rgba(243, 199, 62, 0.75), inset 0 0 10px rgba(243, 199, 62, 0.4);
        opacity: 0; transform: scale(0.25);
        animation: ping 1.5s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }
      .r2 { animation-delay: 0.42s; }
      .r3 { animation-delay: 0.84s; }
      @keyframes ping {
        0%   { opacity: 0;    transform: scale(0.25); border-width: 5px; }
        12%  { opacity: 0.95; }
        100% { opacity: 0;    transform: scale(5.2);  border-width: 1px; }
      }

      /* Respect the OS "reduce motion" setting — but a frozen halo reads as
         "nothing happened", which defeats the whole point of a find button.
         Pulse opacity in place instead: one ring, no travel, no scaling, so
         there's nothing to trigger vestibular discomfort, and it's still
         unmistakably a ping. Note this branch is what you get whenever Windows
         has "Animation effects" switched off, not just with a screen-reader. */
      @media (prefers-reduced-motion: reduce) {
        .ring {
          transform: scale(2.6); border-width: 3px;
          animation: blip 0.9s ease-in-out 3 both;
        }
        .r2, .r3 { display: none; }
        .glow { animation: blipglow 0.9s ease-in-out 3 both; }
        @keyframes blip     { 0%, 100% { opacity: 0.12; } 50% { opacity: 1; } }
        @keyframes blipglow { 0%, 100% { opacity: 0.2; }  50% { opacity: 1; } }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="glow"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
    </div>
  </body>
</html>
